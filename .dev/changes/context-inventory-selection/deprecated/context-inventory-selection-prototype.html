<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Midcompact DraftPlan Prototype</title>
<style>
  :root {
    --bg: #0b0e14; --panel: #11151f; --panel-2: #161b28; --elev: #1d2333;
    --line: #252d42; --line-soft: #1a2032; --fg: #e8ebf3; --dim: #98a3bc; --mute: #68738d;
    --accent: #7aa2f7; --range: #7dcfff; --keep: #9ece6a; --warn: #e0af68; --danger: #f7768e;
    --shadow: 0 16px 42px rgba(0,0,0,.4); --radius: 8px;
    --mono: ui-monospace, SFMono-Regular, Consolas, monospace;
    --sans: "HarmonyOS Sans SC", "HarmonyOS Sans", "Noto Sans CJK SC", "Noto Sans SC", "Microsoft YaHei UI", "Microsoft YaHei", "PingFang SC", system-ui, sans-serif;
  }
  [data-theme="light"] {
    --bg: #f3f5fa; --panel: #fff; --panel-2: #f7f9fc; --elev: #e9edf5;
    --line: #d8dfec; --line-soft: #e6ebf3; --fg: #1b2130; --dim: #5c667b; --mute: #8a93a8;
    --accent: #3b6ef6; --range: #0d84c4; --keep: #178b4e; --warn: #aa640d; --danger: #c93952;
    --shadow: 0 16px 36px rgba(31,41,55,.14);
  }
  * { box-sizing: border-box; }
  html, body { min-height: 100%; margin: 0; }
  body { background: var(--bg); color: var(--fg); font: 14px/1.55 var(--sans); -webkit-font-smoothing: antialiased; }
  button, input, textarea { color: inherit; font: inherit; }
  button { cursor: pointer; }
  button:disabled { cursor: not-allowed; opacity: .45; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .mono { font-family: var(--mono); }
  .shell { min-height: 100vh; display: flex; flex-direction: column; }
  .topbar { min-height: 60px; display: flex; align-items: center; gap: 12px; padding: 12px 20px; background: var(--panel); border-bottom: 1px solid var(--line); }
  .brand { margin: 0; font-size: 17px; letter-spacing: 0; }
  .brand strong { color: var(--accent); }
  .spacer { flex: 1; }
  .chip, .badge { border: 1px solid var(--line); background: var(--panel-2); color: var(--dim); border-radius: 999px; padding: 4px 10px; font: 12px var(--mono); }
  .badge.pending { color: var(--warn); border-color: color-mix(in srgb, var(--warn) 55%, var(--line)); }
  .badge.keep { color: var(--keep); border-color: color-mix(in srgb, var(--keep) 55%, var(--line)); }
  .icon-btn, .btn { border: 1px solid var(--line); background: var(--panel-2); border-radius: 7px; padding: 8px 12px; transition: background .14s, border-color .14s; }
  .icon-btn { width: 36px; height: 34px; padding: 0; }
  .btn:hover, .icon-btn:hover { background: var(--elev); border-color: var(--accent); }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: #08101e; font-weight: 650; }
  [data-theme="light"] .btn.primary { color: #fff; }
  .btn.danger { color: var(--danger); border-color: color-mix(in srgb, var(--danger) 55%, var(--line)); }
  .content { width: min(1500px, 100%); margin: 0 auto; padding: 26px 24px 60px; flex: 1; }
  .page-head { display: flex; align-items: end; gap: 16px; margin-bottom: 18px; }
  .page-head h1 { margin: 0; font-size: 24px; letter-spacing: 0; }
  .page-head p { margin: 5px 0 0; color: var(--dim); font-size: 14px; }
  .page-head .right { margin-left: auto; display: flex; gap: 8px; align-items: center; }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: 0 4px 18px rgba(0,0,0,.08); }
  .panel-head { display: flex; align-items: center; gap: 10px; padding: 12px 14px; border-bottom: 1px solid var(--line-soft); }
  .panel-head h2 { margin: 0; font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: var(--dim); }
  .panel-body { padding: 14px; }
  .muted { color: var(--dim); }
  .quiet { color: var(--mute); }
  .metric-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; margin-bottom: 14px; }
  .metric { background: var(--panel-2); border: 1px solid var(--line); border-radius: 7px; padding: 11px 13px; }
  .metric label { display: block; color: var(--mute); font-size: 11px; letter-spacing: .07em; text-transform: uppercase; }
  .metric strong { display: block; margin-top: 4px; font: 16px var(--mono); }
  .metric small { color: var(--dim); font: 12px var(--sans); }
  .notice { border-left: 3px solid var(--accent); background: var(--panel-2); padding: 12px 14px; color: var(--dim); margin-bottom: 14px; }
  .notice strong { color: var(--fg); }
  .grid { display: grid; gap: 1px; background: var(--line); }
  .workbench { grid-template-columns: 280px minmax(0, 1fr) 370px; grid-template-areas: "ranges timeline editor"; min-height: 680px; }
  .pane { min-width: 0; background: var(--bg); display: flex; flex-direction: column; }
  .pane.ranges { grid-area: ranges; background: var(--panel); }
  .pane.timeline { grid-area: timeline; }
  .pane.editor { grid-area: editor; background: var(--panel); }
  .pane-head { min-height: 49px; display: flex; align-items: center; gap: 8px; padding: 10px 12px; border-bottom: 1px solid var(--line-soft); }
  .pane-title { color: var(--dim); font-size: 12px; letter-spacing: .08em; text-transform: uppercase; }
  .scroll { flex: 1; min-height: 0; overflow: auto; }
  .search { width: 100%; background: var(--panel-2); border: 1px solid var(--line); border-radius: 7px; padding: 8px 10px; }
  .range-list { display: flex; flex-direction: column; gap: 7px; padding: 9px; }
  .range-item { width: 100%; text-align: left; border: 1px solid var(--line); border-left: 3px solid var(--line); border-radius: 7px; background: var(--panel-2); padding: 10px 11px; }
  .range-item:hover, .range-item.selected { border-color: var(--range); background: color-mix(in srgb, var(--range) 10%, var(--panel-2)); }
  .range-item .top { display: flex; align-items: center; gap: 7px; font: 12px var(--mono); }
  .range-item strong { color: var(--range); }
  .range-item .top .spacer { min-width: 4px; }
  .range-item p { margin: 6px 0 0; color: var(--dim); font-size: 12px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .timeline { display: flex; flex-direction: column; gap: 9px; padding: 10px 12px 40px; }
  .group { border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: var(--panel); }
  .group.selected { border-color: var(--range); box-shadow: 0 0 0 1px color-mix(in srgb, var(--range) 35%, transparent); }
  .group-head { display: flex; align-items: center; gap: 9px; padding: 10px 11px; background: var(--panel-2); border-bottom: 1px solid var(--line-soft); }
  .group-head .toggle { border: 0; background: transparent; color: var(--mute); padding: 0 2px; font-size: 13px; }
  .group-head .title { font-weight: 650; font-size: 13px; }
  .group-head .stats { color: var(--dim); font: 11px var(--mono); }
  .group-head .spacer { min-width: 6px; }
  .atoms { padding: 4px 8px 8px; }
  .atom { display: grid; grid-template-columns: 82px 86px minmax(0, 1fr) auto; gap: 10px; align-items: start; padding: 10px 5px; border-top: 1px solid var(--line-soft); }
  .atom:first-child { border-top: 0; }
  .atom.in-plan { background: color-mix(in srgb, var(--range) 9%, transparent); }
  .atom.keep { background: color-mix(in srgb, var(--keep) 8%, transparent); }
  .atom .ref { color: var(--accent); font: 12px var(--mono); }
  .atom .kind { color: var(--dim); font: 12px var(--mono); }
  .atom .preview { display: block; min-height: 2.8em; padding: 7px 9px; border-left: 2px solid var(--line); background: var(--panel-2); color: var(--fg); font: 12.5px/1.55 var(--mono); white-space: pre-wrap; word-break: break-word; }
  .atom.tool .preview { border-left-color: var(--accent); }
  .tool-line { display: flex; align-items: center; gap: 7px; margin-bottom: 5px; }
  .tool-pill { display: inline-flex; align-items: center; border: 1px solid var(--accent); border-radius: 5px; padding: 2px 7px; color: var(--accent); background: color-mix(in srgb, var(--accent) 12%, transparent); font: 11px var(--mono); font-weight: 700; letter-spacing: .04em; }
  .tool-pill.read { color: #7dcfff; border-color: #7dcfff; }
  .tool-pill.write { color: var(--keep); border-color: var(--keep); }
  .tool-pill.edit { color: #bb9af7; border-color: #bb9af7; }
  .tool-pill.bash { color: var(--warn); border-color: var(--warn); }
  .tool-detail { color: var(--dim); font: 11px var(--mono); }
  .facts { margin-top: 5px; color: var(--mute); font: 11px var(--mono); }
  .atom-actions { display: flex; gap: 5px; }
  .mini { border: 1px solid var(--line); background: var(--panel-2); border-radius: 6px; padding: 5px 8px; font-size: 12px; }
  .mini:hover { border-color: var(--accent); }
  .mini.keep-action { color: var(--keep); }
  .editor-body { padding: 16px; display: flex; flex-direction: column; gap: 15px; }
  .editor-title { display: flex; align-items: baseline; gap: 9px; flex-wrap: wrap; }
  .editor-title strong { color: var(--range); font: 16px var(--mono); }
  .editor-title span { color: var(--mute); font: 12px var(--mono); }
  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .stat { background: var(--panel-2); border: 1px solid var(--line); border-radius: 7px; padding: 8px 9px; }
  .stat label { display: block; color: var(--mute); font-size: 11px; text-transform: uppercase; }
  .stat strong { font: 13px var(--mono); }
  textarea { width: 100%; min-height: 260px; resize: vertical; background: var(--panel-2); border: 1px solid var(--line); border-radius: 7px; padding: 10px; font: 13px/1.65 var(--mono); }
  textarea:focus, input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 25%, transparent); }
  .empty { color: var(--mute); text-align: center; padding: 45px 18px; }
  .choice-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; }
  .choice { min-height: 180px; display: flex; flex-direction: column; padding: 20px; text-align: left; border: 1px solid var(--line); background: var(--panel); border-radius: var(--radius); }
  .choice:hover { border-color: var(--accent); background: var(--panel-2); }
  .choice h2 { margin: 0 0 8px; font-size: 18px; }
  .choice p { margin: 0; color: var(--dim); font-size: 14px; }
  .choice-foot { margin-top: auto; padding-top: 20px; color: var(--accent); font: 12px var(--mono); }
  .floating { position: fixed; right: 22px; bottom: 22px; z-index: 20; }
  .floating > button { width: 44px; height: 44px; border-radius: 50%; border: 1px solid var(--accent); background: var(--accent); color: #08101e; font-size: 20px; box-shadow: var(--shadow); }
  .nav-pop { display: none; position: absolute; right: 0; bottom: 54px; width: 180px; padding: 7px; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; box-shadow: var(--shadow); }
  .nav-pop.open { display: grid; gap: 4px; }
  .nav-pop a { display: block; padding: 9px; border-radius: 6px; color: var(--fg); text-decoration: none; }
  .nav-pop a:hover { background: var(--elev); }
  .modal-backdrop { position: fixed; inset: 0; z-index: 30; display: none; place-items: center; padding: 20px; background: rgba(0,0,0,.54); }
  .modal-backdrop.open { display: grid; }
  .modal { width: min(430px, 100%); background: var(--panel); border: 1px solid var(--line); border-radius: 8px; box-shadow: var(--shadow); padding: 19px; }
  .modal h2 { margin: 0 0 8px; font-size: 16px; }
  .modal p { margin: 0; color: var(--dim); }
  .modal-actions { display: flex; justify-content: end; gap: 8px; margin-top: 19px; }
  .toast { position: fixed; left: 50%; bottom: 25px; transform: translate(-50%, 12px); opacity: 0; pointer-events: none; z-index: 40; padding: 11px 15px; background: var(--panel-2); border: 1px solid var(--line); border-radius: 7px; box-shadow: var(--shadow); transition: opacity .16s, transform .16s; }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }
  @media (max-width: 1180px) { .workbench { grid-template-columns: 250px minmax(0,1fr); grid-template-rows: minmax(0,1fr) auto; grid-template-areas: "ranges timeline" "editor editor"; } }
  @media (max-width: 760px) { .content { padding: 20px 12px 58px; } .topbar { padding: 11px 12px; } .page-head { align-items: start; flex-direction: column; } .page-head .right { margin-left: 0; } .metric-grid { grid-template-columns: repeat(2,1fr); } .choice-grid { grid-template-columns: 1fr; } .workbench { grid-template-columns: 1fr; grid-template-rows: auto auto auto; grid-template-areas: "ranges" "timeline" "editor"; } .atom { grid-template-columns: 70px 1fr; } .atom .atom-actions { grid-column: 1 / -1; } }
</style>
</head>
<body>
<div class="shell">
  <header class="topbar"><h1 class="brand"><strong>Midcompact</strong> DraftPlan</h1><span class="chip" id="route-chip">prototype</span><span class="spacer"></span><button class="icon-btn" id="theme" title="Toggle theme" aria-label="Toggle theme">◐</button></header>
  <main class="content" id="app"></main>
</div>
<div class="floating"><nav class="nav-pop" id="nav-pop" aria-label="Prototype views"><a href="?view=start">Start</a><a href="?view=selection">Selection</a><a href="?view=review">Review</a></nav><button id="nav-toggle" title="Switch prototype view" aria-label="Switch prototype view">+</button></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<div class="modal-backdrop" id="modal-backdrop"><div class="modal" role="dialog" aria-modal="true"><h2>Unsaved changes</h2><p>Save the current DraftPlan before leaving?</p><div class="modal-actions"><button class="btn" id="modal-stay">Stay</button><button class="btn danger" id="modal-discard">Discard</button><button class="btn primary" id="modal-save">Save &amp; close</button></div></div></div>
<script>
  const DATA = { groups: [
    { id: 'g01', label: 'Project setup and constraints', atoms: [
      { ref: 'a0001', kind: 'user', preview: 'Define the project constraints and expected workflow.', chars: 284, images: 0, protected: false },
      { ref: 'a0002', kind: 'assistant', preview: 'Propose a plan for measuring context cost and preserving protocol safety.', chars: 912, images: 0, protected: false },
      { ref: 'a0003', kind: 'tool_exchange', toolNames: ['read'], preview: 'read src/atoms.ts and inspect protocol-safe grouping.', chars: 1260, images: 0, protected: true }
    ] },
    { id: 'g02', label: 'Metrics and inventory exploration', atoms: [
      { ref: 'a0004', kind: 'user', preview: 'Compare character facts, images, and Pi-reported usage.', chars: 338, images: 0, protected: false },
      { ref: 'a0005', kind: 'tool_exchange', toolNames: ['write'], preview: 'write .dev/context-inventory-selection/SPEC.md with the agreed contract.', chars: 1488, images: 0, protected: false },
      { ref: 'a0006', kind: 'assistant', preview: 'Review a screenshot and preserve the visual conclusion for later work.', chars: 760, images: 1, protected: false }
    ] },
    { id: 'g03', label: 'DraftPlan model and runtime safety', atoms: [
      { ref: 'a0007', kind: 'user', preview: 'Treat the user plan as an initial proposal that Agent can continue to edit.', chars: 420, images: 0, protected: false },
      { ref: 'a0008', kind: 'tool_exchange', toolNames: ['edit'], preview: 'edit src/index.ts to enforce the runtime planning lock.', chars: 1730, images: 0, protected: false },
      { ref: 'a0009', kind: 'tool_exchange', toolNames: ['bash'], preview: '$ npm test\n49 tests passed', chars: 1100, images: 0, protected: true }
    ] },
    { id: 'g04', label: 'Existing review surface', atoms: [
      { ref: 'a0010', kind: 'user', preview: 'Keep Selection and Review as separate surfaces over one DraftPlan.', chars: 260, images: 0, protected: false },
      { ref: 'a0011', kind: 'assistant', preview: 'Build a compact desktop-first prototype with query-routed views.', chars: 980, images: 0, protected: false }
    ] }
  ] };
  const allAtoms = DATA.groups.flatMap(group => group.atoms);
  const state = { plan: [{ id: 'd1', start: 'a0004', end: 'a0005', summary: '' }, { id: 'd2', start: 'a0007', end: 'a0008', summary: 'Unify user and Agent planning around one mutable DraftPlan.' }], dirty: false, selectedRange: 'd1', selectedAtoms: new Set(['a0004','a0005','a0007','a0008']), keepAtoms: new Set(), collapsed: new Set() };
  const $ = id => document.getElementById(id);
  const esc = value => String(value ?? '').replace(/[&<>"']/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]));
  const fmt = value => Number(value).toLocaleString('en-US');
  const view = new URLSearchParams(location.search).get('view') || 'start';
  $('route-chip').textContent = ({ start: 'entry', selection: 'user plan', review: 'summary review' }[view] || 'entry');
  function toast(text) { const el = $('toast'); el.textContent = text; el.classList.add('show'); clearTimeout(toast.timer); toast.timer = setTimeout(() => el.classList.remove('show'), 2200); }
  function setView(next) { location.href = `?view=${encodeURIComponent(next)}`; }
  function atomAt(ref) { return allAtoms.find(atom => atom.ref === ref); }
  function atomsForRange(range) { const start = allAtoms.findIndex(atom => atom.ref === range.start); const end = allAtoms.findIndex(atom => atom.ref === range.end); return allAtoms.slice(start, end + 1); }
  function toolBadge(atom) { const names = atom.toolNames ?? []; if (!names.length) return ''; const known = ['read','write','edit','bash']; const labels = names.map(name => { const tone = known.includes(String(name).toLowerCase()) ? String(name).toLowerCase() : ''; return `<span class="tool-pill ${tone}">${esc(name)}</span>`; }).join(''); const detail = names.some(name => ['read','write','edit'].includes(String(name).toLowerCase())) ? 'file operation' : names.some(name => String(name).toLowerCase() === 'bash') ? 'command execution' : 'tool exchange'; return `<div class="tool-line">${labels}<span class="tool-detail">${detail}</span></div>`; }
  function metrics() { const selected = allAtoms.filter(atom => state.selectedAtoms.has(atom.ref)); return { atoms: selected.length, chars: selected.reduce((sum, atom) => sum + atom.chars, 0), images: selected.reduce((sum, atom) => sum + atom.images, 0), pending: state.plan.filter(range => !range.summary.trim()).length }; }
  function metricBar() { const m = metrics(); return `<div class="metric-grid"><div class="metric"><label>Anchor usage</label><strong>68% <small>Pi reported</small></strong></div><div class="metric"><label>Selected atoms</label><strong>${m.atoms} <small>/ ${allAtoms.length}</small></strong></div><div class="metric"><label>Content chars</label><strong>${fmt(m.chars)}</strong></div><div class="metric"><label>Images</label><strong>${m.images} <small>payload facts</small></strong></div></div>`; }
  function rangeRows() { return state.plan.length ? state.plan.map(range => `<button class="range-item ${range.id === state.selectedRange ? 'selected' : ''}" data-range="${range.id}"><div class="top"><strong>${range.id}</strong><span>${range.start} → ${range.end}</span><span class="spacer"></span><span class="badge ${range.summary.trim() ? 'keep' : 'pending'}">${range.summary.trim() ? 'done' : 'pending'}</span></div><p>${range.summary ? esc(range.summary) : 'Pending summary'}</p></button>`).join('') : '<div class="empty">No ranges in this DraftPlan.</div>'; }
  function rebuildPlan() { const wanted = allAtoms.filter(atom => state.selectedAtoms.has(atom.ref) && !atom.protected && !state.keepAtoms.has(atom.ref)); const next = []; let current = []; wanted.forEach(atom => { const previous = current.at(-1); const adjacent = previous && allAtoms.indexOf(atom) === allAtoms.indexOf(previous) + 1; if (!adjacent && current.length) { next.push(current); current = []; } current.push(atom); }); if (current.length) next.push(current); const old = new Map(state.plan.map(range => [`${range.start}:${range.end}`, range])); state.plan = next.map((atoms, index) => { const start = atoms[0].ref; const end = atoms.at(-1).ref; const previous = old.get(`${start}:${end}`); return { id: previous?.id ?? `d${index + 1}`, start, end, summary: previous?.summary ?? '' }; }); state.selectedRange = state.plan.find(range => range.id === state.selectedRange)?.id ?? state.plan[0]?.id ?? null; }
  function toggleAtom(atom) { if (atom.protected) return toast('Protected atom stays KEEP'); if (state.selectedAtoms.has(atom.ref)) state.selectedAtoms.delete(atom.ref); else state.selectedAtoms.add(atom.ref); state.keepAtoms.delete(atom.ref); state.dirty = true; rebuildPlan(); renderWorkbench('selection'); }
  function toggleKeep(atom) { if (atom.protected) return; if (state.keepAtoms.has(atom.ref)) { state.keepAtoms.delete(atom.ref); state.selectedAtoms.add(atom.ref); } else { state.keepAtoms.add(atom.ref); state.selectedAtoms.delete(atom.ref); } state.dirty = true; rebuildPlan(); renderWorkbench('selection'); }
  function addGroup(group) { group.atoms.filter(atom => !atom.protected).forEach(atom => { state.selectedAtoms.add(atom.ref); state.keepAtoms.delete(atom.ref); }); state.dirty = true; rebuildPlan(); toast('Group added; protected atoms remain KEEP'); renderWorkbench('selection'); }
  function removeRange(id) { const range = state.plan.find(candidate => candidate.id === id); if (!range) return; atomsForRange(range).forEach(atom => state.selectedAtoms.delete(atom.ref)); state.dirty = true; rebuildPlan(); toast(`${id} removed from DraftPlan`); renderWorkbench(view === 'review' ? 'review' : 'selection'); }
  function atomRow(atom, mode) { const inPlan = state.selectedAtoms.has(atom.ref); const keep = state.keepAtoms.has(atom.ref) || atom.protected; const tool = (atom.toolNames ?? []).length > 0; return `<div class="atom ${tool ? 'tool' : ''} ${inPlan ? 'in-plan' : ''} ${keep ? 'keep' : ''}"><div class="ref">${atom.ref}</div><div class="kind">${atom.kind}</div><div>${toolBadge(atom)}<div class="preview">${esc(atom.preview)}</div><div class="facts">${fmt(atom.chars)} chars · ${atom.images} image(s)${atom.protected ? ' · protected' : ''}</div></div>${mode === 'selection' ? `<div class="atom-actions"><button class="mini" data-atom="${atom.ref}" data-op="toggle">${inPlan ? 'Remove' : 'Add'}</button><button class="mini keep-action" data-atom="${atom.ref}" data-op="keep" ${atom.protected ? 'disabled' : ''}>${keep ? 'KEEP' : 'Keep'}</button></div>` : '<span></span>'}</div>`; }
  function groupRows(mode) { return DATA.groups.map(group => { const open = !state.collapsed.has(group.id); const selected = group.atoms.some(atom => state.selectedAtoms.has(atom.ref)); return `<section class="group ${selected ? 'selected' : ''}"><div class="group-head"><button class="toggle" data-toggle-group="${group.id}" aria-label="Toggle ${group.id}">${open ? '▼' : '▶'}</button><div><div class="title">${esc(group.id)} · ${esc(group.label)}</div><div class="stats">${group.atoms.length} atoms · ${fmt(group.atoms.reduce((sum, atom) => sum + atom.chars, 0))} chars · ${group.atoms.reduce((sum, atom) => sum + atom.images, 0)} image(s)</div></div><span class="spacer"></span>${mode === 'selection' ? `<button class="btn" data-group="${group.id}">Add group</button>` : ''}</div>${open ? `<div class="atoms">${group.atoms.map(atom => atomRow(atom, mode)).join('')}</div>` : ''}</section>`; }).join(''); }
  function editor(mode) { const range = state.plan.find(candidate => candidate.id === state.selectedRange) ?? state.plan[0]; if (!range) return '<div class="empty">No range selected.</div>'; const atoms = atomsForRange(range); const chars = atoms.reduce((sum, atom) => sum + atom.chars, 0); if (mode === 'selection') return `<div class="editor-body"><div class="editor-title"><strong>${range.id}</strong><span>${range.start} → ${range.end}</span></div><div class="stats"><div class="stat"><label>atoms</label><strong>${atoms.length}</strong></div><div class="stat"><label>chars</label><strong>${fmt(chars)}</strong></div><div class="stat"><label>images</label><strong>${atoms.reduce((sum, atom) => sum + atom.images, 0)}</strong></div></div><div class="notice"><strong>Selection mode</strong><br>Use group and atom controls in the timeline. Protected/tool-exchange atoms stay intact.</div><button class="btn danger" id="remove-range">Remove range</button></div>`; return `<div class="editor-body"><div class="editor-title"><strong>${range.id}</strong><span>${range.start} → ${range.end}</span></div><div class="stats"><div class="stat"><label>atoms</label><strong>${atoms.length}</strong></div><div class="stat"><label>chars</label><strong>${fmt(chars)}</strong></div><div class="stat"><label>images</label><strong>${atoms.reduce((sum, atom) => sum + atom.images, 0)}</strong></div></div><label class="quiet" for="summary">Summary</label><textarea id="summary">${esc(range.summary)}</textarea><div class="toolbar"><button class="btn primary" id="save-summary">Save summary</button><button class="btn danger" id="remove-range">Remove range</button></div><p class="quiet">Review edits summary text. Range creation and KEEP choices belong to Selection.</p></div>`; }
  function bindWorkbench(mode) { document.querySelectorAll('[data-range]').forEach(button => button.onclick = () => { state.selectedRange = button.dataset.range; renderWorkbench(mode); }); document.querySelectorAll('[data-toggle-group]').forEach(button => button.onclick = () => { const id = button.dataset.toggleGroup; if (state.collapsed.has(id)) state.collapsed.delete(id); else state.collapsed.add(id); renderWorkbench(mode); }); document.querySelectorAll('[data-group]').forEach(button => button.onclick = () => addGroup(DATA.groups.find(group => group.id === button.dataset.group))); document.querySelectorAll('[data-op="toggle"]').forEach(button => button.onclick = () => toggleAtom(atomAt(button.dataset.atom))); document.querySelectorAll('[data-op="keep"]').forEach(button => button.onclick = () => toggleKeep(atomAt(button.dataset.atom))); $('remove-range')?.addEventListener('click', () => removeRange(state.selectedRange)); if (mode === 'review') $('save-summary')?.addEventListener('click', () => { const range = state.plan.find(candidate => candidate.id === state.selectedRange); if (!range) return; range.summary = $('summary').value.trim(); state.dirty = false; renderWorkbench('review'); toast('Summary saved'); }); }
  function closePage(mode) { if (!state.dirty) return setView('start'); $('modal-backdrop').classList.add('open'); $('modal-save').onclick = () => { state.dirty = false; $('modal-backdrop').classList.remove('open'); toast('DraftPlan saved'); setView('start'); }; $('modal-discard').onclick = () => { state.dirty = false; $('modal-backdrop').classList.remove('open'); setView('start'); }; $('modal-stay').onclick = () => $('modal-backdrop').classList.remove('open'); }
  function renderWorkbench(mode) { const selection = mode === 'selection'; const m = metrics(); $('route-chip').textContent = selection ? 'user plan' : 'summary review'; $('app').innerHTML = `<div class="page-head"><div><h1>${selection ? 'User manual selection' : 'Review DraftPlan'}</h1><p>${selection ? 'Edit the initial DraftPlan from the same inventory Agent can inspect.' : 'Review summary text while the range list and timeline stay familiar.'}</p></div><div class="right"><span class="badge ${m.pending ? 'pending' : 'keep'}">${m.pending ? `${m.pending} pending` : 'ready'}</span><button class="btn" id="close-page">Close</button>${selection ? '<button class="btn primary" id="save-close">Save &amp; close</button>' : `<button class="btn primary" id="commit" ${m.pending ? 'disabled' : ''}>Commit</button>`}</div></div>${metricBar()}<div class="grid workbench"><section class="pane ranges"><div class="pane-head"><span class="pane-title">Draft ranges</span><span class="spacer"></span><span class="chip mono">v12</span></div><div class="scroll"><div class="range-list">${rangeRows()}</div></div></section><section class="pane timeline"><div class="pane-head"><span class="pane-title">Anchor timeline</span><span class="chip">same inventory as inspect</span><span class="spacer"></span><span class="chip mono">${allAtoms.length} atoms</span></div><div class="scroll"><div class="timeline">${groupRows(mode)}</div></div></section><aside class="pane editor"><div class="pane-head"><span class="pane-title">${selection ? 'Selection controls' : 'Summary editor'}</span></div><div class="scroll">${editor(mode)}</div></aside></div>`; bindWorkbench(mode); $('close-page').onclick = () => closePage(mode); if (selection) $('save-close').onclick = () => { state.dirty = false; toast('DraftPlan saved'); setView('start'); }; else $('commit').onclick = () => toast(m.pending ? 'Complete all summaries before commit' : 'Commit is a user action'); }
  function renderStart() { $('route-chip').textContent = 'entry'; $('app').innerHTML = `<div class="page-head"><div><h1>Start midcompact</h1><p>Choose how the initial DraftPlan should be created.</p></div><div class="right"><span class="chip mono">anchor: e3</span><span class="chip mono">68% Pi reported</span></div></div><div class="notice"><strong>Drop</strong> leaves the session unchanged. The two enter choices share the same DraftPlan model.</div><div class="choice-grid"><button class="choice" id="drop"><h2>Drop</h2><p>Cancel this start without creating a transaction.</p><span class="choice-foot">No state change</span></button><button class="choice" id="agent"><h2>Agent direct</h2><p>Let Agent inspect the anchor and create the initial DraftPlan.</p><span class="choice-foot">Enter → Agent turn</span></button><button class="choice" id="manual"><h2>User manual</h2><p>Open the Selection surface and edit the initial DraftPlan yourself.</p><span class="choice-foot">Enter → Selection</span></button></div><section class="panel" style="margin-top:14px"><div class="panel-head"><h2>Frozen anchor facts</h2></div><div class="panel-body">${metricBar()}</div></section>`; $('drop').onclick = () => toast('Start dropped; no transaction created'); $('agent').onclick = () => setView('review'); $('manual').onclick = () => setView('selection'); }
  $('nav-toggle').onclick = () => $('nav-pop').classList.toggle('open'); $('theme').onclick = () => { const root = document.documentElement; root.dataset.theme = root.dataset.theme === 'light' ? 'dark' : 'light'; }; $('modal-stay').onclick = () => $('modal-backdrop').classList.remove('open'); ({ start: renderStart, selection: () => renderWorkbench('selection'), review: () => renderWorkbench('review') }[view] || renderStart)();
</script>
</body>
