<svg xmlns="http://www.w3.org/2000/svg"
     width="1400" height="1300" viewBox="0 0 1400 1300"
     role="img" aria-labelledby="title desc">
  <title id="title">pi-midcompact — how compression works</title>
  <desc id="desc">Session tree with anchor, maintenance branch and state entry; request-time projection before/after the model sees context; transaction lifecycle across human, extension and agent lanes.</desc>

  <defs>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#2563eb"/>
    </marker>
  </defs>

  <g font-family="Arial, Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif">

    <!-- ============ HEADER ============ -->
    <text x="60" y="54" font-size="34" font-weight="600" fill="#202124">pi-midcompact — how compression works</text>
    <text x="60" y="92" font-size="18" fill="#5f6368">Selective mid-context compression for the Pi coding agent: non-destructive · branch-versioned · human-gated</text>
    <line x1="60" y1="118" x2="1340" y2="118" stroke="#dadce0" stroke-width="1.5"/>

    <!-- ============ SECTION TITLES ============ -->
    <text x="60" y="158" font-size="21" font-weight="600" fill="#202124">① Session tree — where state lives</text>
    <text x="780" y="158" font-size="21" font-weight="600" fill="#202124">② Projection — what the model sees, before &amp; after</text>
    <text x="60" y="972" font-size="21" font-weight="600" fill="#202124">③ Transaction lifecycle — who does what, in order</text>
    <text x="1340" y="972" text-anchor="end" font-size="14" fill="#5f6368">commit is a human command — never an agent tool</text>

    <!-- ============ ① SESSION TREE ============ -->
    <g id="session-tree">
      <!-- main trunk -->
      <line x1="110" y1="223" x2="110" y2="330" stroke="#9aa0a6" stroke-width="2.5" stroke-dasharray="6 6"/>
      <line x1="110" y1="330" x2="110" y2="842" stroke="#202124" stroke-width="2.5"/>
      <text x="110" y="290" text-anchor="middle" font-size="15" fill="#9aa0a6">⋯</text>
      <text x="110" y="776" text-anchor="middle" font-size="15" fill="#5f6368">⋯</text>

      <!-- compressed blocks (left brackets) -->
      <g stroke="#f59e0b" stroke-width="2.6" fill="none">
        <path d="M78,242 L92,242 L92,335 L78,335"/>
        <path d="M78,358 L92,358 L92,390 L78,390"/>
        <path d="M78,403 L92,403 L92,435 L78,435"/>
      </g>
      <g font-size="13" fill="#b45309" text-anchor="middle">
        <text x="60" y="282">c0001</text>
        <text x="60" y="300" font-size="12">62K tok</text>
        <text x="60" y="368">c0002</text>
        <text x="60" y="386" font-size="12">22K tok</text>
        <text x="60" y="413">c0003</text>
        <text x="60" y="431" font-size="12">22K tok</text>
      </g>

      <!-- trunk nodes -->
      <g fill="#ffffff" stroke="#202124" stroke-width="2">
        <circle cx="110" cy="230" r="8"/>
        <circle cx="110" cy="345" r="8"/>
        <circle cx="110" cy="390" r="8"/>
        <circle cx="110" cy="435" r="8"/>
        <circle cx="110" cy="480" r="8"/>
        <circle cx="110" cy="680" r="8"/>
        <circle cx="110" cy="725" r="8"/>
        <circle cx="110" cy="810" r="8"/>
      </g>
      <circle cx="110" cy="525" r="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2.4"/>
      <text x="110" y="531" text-anchor="middle" font-size="13" fill="#1d4ed8">★</text>

      <!-- state entry -->
      <rect x="76" y="592" width="68" height="36" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
      <text x="110" y="616" text-anchor="middle" font-size="14" font-weight="600" fill="#047857">state</text>

      <!-- node labels -->
      <g font-size="14" fill="#5f6368">
        <text x="132" y="235">T1 · session start</text>
        <text x="132" y="350">T46 · user msg</text>
        <text x="132" y="395">T47 · user msg</text>
        <text x="132" y="440">T48 · user msg</text>
        <text x="132" y="485">T49 · user msg</text>
        <text x="132" y="530" font-weight="600" fill="#1d4ed8">T50 ★ anchor</text>
        <text x="132" y="685">T80 · new work</text>
        <text x="132" y="730">T81</text>
        <text x="132" y="815">T90</text>
        <text x="158" y="606" font-size="12" fill="#047857">midcompact-state entry</text>
        <text x="158" y="624" font-size="12" fill="#047857">work continues from here</text>
      </g>

      <!-- maintenance branch (orphan) -->
      <line x1="110" y1="525" x2="260" y2="525" stroke="#7b8087" stroke-width="2" stroke-dasharray="6 5"/>
      <line x1="260" y1="525" x2="260" y2="812" stroke="#7b8087" stroke-width="2" stroke-dasharray="6 5"/>
      <line x1="260" y1="568" x2="276" y2="568" stroke="#7b8087" stroke-width="1.6"/>
      <line x1="260" y1="616" x2="276" y2="616" stroke="#7b8087" stroke-width="1.6"/>
      <rect x="276" y="552" width="76" height="32" rx="7" fill="#ffffff" stroke="#9aa0a6" stroke-width="1.6" stroke-dasharray="5 4"/>
      <text x="314" y="574" text-anchor="middle" font-size="14" fill="#202124">txn</text>
      <rect x="276" y="600" width="76" height="32" rx="7" fill="#ffffff" stroke="#9aa0a6" stroke-width="1.6" stroke-dasharray="5 4"/>
      <text x="314" y="622" text-anchor="middle" font-size="14" fill="#202124">draft</text>

      <rect x="276" y="648" width="440" height="164" rx="10" fill="#fafafa" stroke="#9aa0a6" stroke-width="1.8" stroke-dasharray="7 6"/>
      <text x="302" y="680" font-size="16" font-weight="600" fill="#202124">Maintenance conversation</text>
      <text x="302" y="708" font-size="14" fill="#5f6368">locate → plan → draft review</text>
      <text x="302" y="730" font-size="14" fill="#5f6368">runs on the frozen anchor snapshot,</text>
      <text x="302" y="752" font-size="14" fill="#5f6368">using temp refs like a0007</text>
      <text x="302" y="776" font-size="14" fill="#b45309">abandoned at commit — never enters</text>
      <text x="302" y="796" font-size="14" fill="#b45309">the working context</text>

      <!-- legend + notes -->
      <g font-size="14" fill="#5f6368">
        <text x="60" y="856">★ anchor</text>
        <rect x="140" y="846" width="14" height="14" rx="3" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.6"/>
        <text x="162" y="858">compressed block</text>
        <rect x="292" y="846" width="14" height="14" rx="3" fill="#ecfdf5" stroke="#059669" stroke-width="1.6"/>
        <text x="314" y="858">state entry</text>
        <line x1="420" y1="853" x2="458" y2="853" stroke="#7b8087" stroke-width="2" stroke-dasharray="6 5"/>
        <text x="468" y="858">abandoned branch</text>
      </g>
      <text x="60" y="890" font-size="13.5" fill="#5f6368">State is branch-local: navigate before the anchor → original view; navigate back → projection resumes.</text>
    </g>

    <!-- ============ ② PROJECTION ============ -->
    <g id="projection">
      <!-- BEFORE panel -->
      <rect x="800" y="200" width="520" height="360" rx="10" fill="#ffffff" stroke="#9aa0a6" stroke-width="2"/>
      <text x="824" y="228" font-size="15" font-weight="600" fill="#202124">BEFORE — raw entries at every request</text>
      <text x="1304" y="228" text-anchor="end" font-size="13.5" fill="#b45309">amber border = targeted range</text>

      <g font-size="13.5">
        <rect x="816" y="244" width="488" height="34" rx="7" fill="#ffffff" stroke="#202124" stroke-width="1.6"/>
        <text x="832" y="266"><tspan font-weight="600">user</tspan> · analyze the project</text>

        <rect x="816" y="288" width="488" height="34" rx="7" fill="#ffffff" stroke="#f59e0b" stroke-width="2"/>
        <text x="832" y="310"><tspan font-weight="600">assistant</tspan> · reading sources…</text>

        <rect x="816" y="332" width="488" height="34" rx="7" fill="#fafafa" stroke="#f59e0b" stroke-width="2"/>
        <text x="832" y="354"><tspan font-weight="600">tool</tspan> · bash · read ×N</text>

        <rect x="816" y="376" width="488" height="34" rx="7" fill="#ffffff" stroke="#f59e0b" stroke-width="2"/>
        <text x="832" y="398"><tspan font-weight="600">assistant</tspan> · verifying APIs…</text>

        <rect x="816" y="420" width="488" height="34" rx="7" fill="#fafafa" stroke="#f59e0b" stroke-width="2"/>
        <text x="832" y="442"><tspan font-weight="600">tool</tspan> · grep ×N</text>

        <rect x="816" y="464" width="488" height="34" rx="7" fill="#ffffff" stroke="#9aa0a6" stroke-width="1.6"/>
        <text x="832" y="486"><tspan font-weight="600">assistant</tspan> · conclusion (kept)</text>

        <rect x="816" y="508" width="488" height="34" rx="7" fill="#ffffff" stroke="#202124" stroke-width="1.6"/>
        <text x="832" y="530"><tspan font-weight="600">user</tspan> · write the report…</text>
      </g>

      <!-- transformer -->
      <line x1="1010" y1="560" x2="1010" y2="588" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow-blue)"/>
      <rect x="880" y="590" width="260" height="38" rx="19" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
      <text x="1010" y="615" text-anchor="middle" font-size="14.5" fill="#1d4ed8">context hook · fingerprint match</text>
      <text x="1160" y="652" text-anchor="middle" font-size="13.5" fill="#5f6368">no match → keep raw · fail-open</text>
      <line x1="1010" y1="628" x2="1010" y2="656" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow-blue)"/>

      <!-- AFTER panel -->
      <rect x="800" y="658" width="520" height="252" rx="10" fill="#ffffff" stroke="#9aa0a6" stroke-width="2"/>
      <text x="824" y="686" font-size="15" font-weight="600" fill="#202124">AFTER — projected context sent to model</text>

      <g font-size="13.5">
        <rect x="816" y="706" width="488" height="34" rx="7" fill="#ffffff" stroke="#202124" stroke-width="1.6"/>
        <text x="832" y="728"><tspan font-weight="600">user</tspan> · analyze the project</text>

        <rect x="816" y="750" width="488" height="34" rx="7" fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/>
        <text x="832" y="772"><tspan font-weight="600">summary c0001</tspan></text>
        <text x="1292" y="772" font-size="12" fill="#b45309">custom→user</text>

        <rect x="816" y="794" width="488" height="34" rx="7" fill="#ffffff" stroke="#9aa0a6" stroke-width="1.6"/>
        <text x="832" y="816"><tspan font-weight="600">assistant</tspan> · conclusion (kept)</text>

        <rect x="816" y="838" width="488" height="34" rx="7" fill="#ffffff" stroke="#202124" stroke-width="1.6"/>
        <text x="832" y="860"><tspan font-weight="600">user</tspan> · write the report…</text>
      </g>
      <text x="824" y="902" font-size="13.5" fill="#5f6368">questions &amp; conclusions stay raw; matched ranges become summaries</text>

      <text x="780" y="944" font-size="13.5" fill="#5f6368">Projection is request-time only — session entries are never modified.</text>
    </g>

    <!-- ============ ③ TRANSACTION LIFECYCLE ============ -->
    <g id="lifecycle">
      <!-- lanes -->
      <rect x="60" y="1004" width="1300" height="82" rx="10" fill="#fafafa" stroke="#e5e7eb" stroke-width="1.4"/>
      <rect x="60" y="1091" width="1300" height="82" rx="10" fill="#f8fbff" stroke="#e5e7eb" stroke-width="1.4"/>
      <rect x="60" y="1178" width="1300" height="82" rx="10" fill="#fffdf7" stroke="#e5e7eb" stroke-width="1.4"/>
      <g font-size="17" font-weight="600" fill="#5f6368" text-anchor="end">
        <text x="50" y="1044">Human</text>
        <text x="50" y="1131">Extension</text>
        <text x="50" y="1218">Agent</text>
      </g>

      <!-- step cards -->
      <g>
        <!-- 1 human -->
        <rect x="80" y="1010" width="164" height="72" rx="10" fill="#ffffff" stroke="#202124" stroke-width="2"/>
        <circle cx="226" cy="1025" r="10" fill="#202124"/>
        <text x="226" y="1030" text-anchor="middle" font-size="12" fill="#ffffff">1</text>
        <text x="96" y="1039" font-size="17" font-weight="600" fill="#202124">/midcompact</text>
        <text x="96" y="1061" font-size="14" fill="#5f6368">start at a clean leaf</text>

        <!-- 2 extension -->
        <rect x="260" y="1097" width="164" height="72" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
        <circle cx="406" cy="1112" r="10" fill="#2563eb"/>
        <text x="406" y="1117" text-anchor="middle" font-size="12" fill="#ffffff">2</text>
        <text x="276" y="1126" font-size="17" font-weight="600" fill="#202124">Freeze + fork</text>
        <text x="276" y="1148" font-size="14" fill="#5f6368">write TXN / DRAFT</text>
        <text x="276" y="1166" font-size="14" fill="#5f6368">kick off chat</text>

        <!-- 3 agent -->
        <rect x="440" y="1184" width="164" height="72" rx="10" fill="#fffbeb" stroke="#d97706" stroke-width="2"/>
        <circle cx="586" cy="1199" r="10" fill="#d97706"/>
        <text x="586" y="1204" text-anchor="middle" font-size="12" fill="#ffffff">3</text>
        <text x="456" y="1213" font-size="17" font-weight="600" fill="#202124">locate</text>
        <text x="456" y="1235" font-size="14" fill="#5f6368">snapshot → landmarks</text>
        <text x="456" y="1253" font-size="14" fill="#5f6368">→ atom refs (a0007)</text>

        <!-- 4 agent -->
        <rect x="620" y="1184" width="164" height="72" rx="10" fill="#fffbeb" stroke="#d97706" stroke-width="2"/>
        <circle cx="766" cy="1199" r="10" fill="#d97706"/>
        <text x="766" y="1204" text-anchor="middle" font-size="12" fill="#ffffff">4</text>
        <text x="636" y="1213" font-size="17" font-weight="600" fill="#202124">plan</text>
        <text x="636" y="1235" font-size="14" fill="#5f6368">add / adjust ranges</text>
        <text x="636" y="1253" font-size="14" fill="#5f6368">draft v1 → v3</text>

        <!-- 5 human -->
        <rect x="800" y="1010" width="164" height="72" rx="10" fill="#ffffff" stroke="#202124" stroke-width="2"/>
        <circle cx="946" cy="1025" r="10" fill="#202124"/>
        <text x="946" y="1030" text-anchor="middle" font-size="12" fill="#ffffff">5</text>
        <text x="816" y="1039" font-size="17" font-weight="600" fill="#202124">Review draft</text>
        <text x="816" y="1061" font-size="14" fill="#5f6368">check boundaries</text>
        <text x="816" y="1079" font-size="14" fill="#5f6368">&amp; summary quality</text>

        <!-- 6 human -->
        <rect x="980" y="1010" width="164" height="72" rx="10" fill="#ffffff" stroke="#202124" stroke-width="2"/>
        <circle cx="1126" cy="1025" r="10" fill="#202124"/>
        <text x="1126" y="1030" text-anchor="middle" font-size="12" fill="#ffffff">6</text>
        <text x="996" y="1039" font-size="17" font-weight="600" fill="#202124">/midcompact</text>
        <text x="996" y="1061" font-size="14" fill="#5f6368">commit after review</text>
        <text x="996" y="1079" font-size="14" fill="#5f6368">human confirms</text>

        <!-- 7 extension -->
        <rect x="1160" y="1097" width="164" height="72" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
        <circle cx="1306" cy="1112" r="10" fill="#2563eb"/>
        <text x="1306" y="1117" text-anchor="middle" font-size="12" fill="#ffffff">7</text>
        <text x="1176" y="1126" font-size="17" font-weight="600" fill="#202124">Back · persist</text>
        <text x="1176" y="1148" font-size="14" fill="#5f6368">waitForIdle → anchor</text>
        <text x="1176" y="1166" font-size="14" fill="#5f6368">appendEntry(state)</text>
      </g>

      <!-- arrows -->
      <g fill="none" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow-blue)">
        <polyline points="244,1044 256,1044 256,1131 260,1131"/>
        <polyline points="424,1131 436,1131 436,1218 440,1218"/>
        <line x1="604" y1="1218" x2="620" y2="1218"/>
        <polyline points="784,1218 808,1218 808,1078"/>
        <line x1="964" y1="1044" x2="980" y2="1044"/>
        <polyline points="1144,1044 1156,1044 1156,1131 1160,1131"/>
      </g>
    </g>

    <!-- ============ FOOTER ============ -->
    <text x="60" y="1282" font-size="13.5" fill="#5f6368">
      Measured on Pi v0.84.1: 3 blocks · ≈106K → 598 tokens · 25 maintenance entries orphaned · all 137 original entries verified intact
    </text>

  </g>
</svg>
